name: CI
# CI de Atlas Rent. Los jobs backend y frontend se detectan solos cuando existen la solución y
# frontend/package.json.
# La detección se hace con un paso, no con un `if` de nivel de job: en `jobs.<job_id>.if` GitHub solo
# admite `always`, `cancelled`, `success` y `failure`, así que `hashFiles` ahí invalida el workflow
# entero y la CI termina en rojo sin crear ni un job (BUG-018). En `steps.if` sí se admite.
on:
  pull_request:
  push:
    branches: [main, V-01.00]
permissions:
  contents: read
jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Los proyectos van en backend/, así que el detector busca en todo el subárbol y no en la raíz.
      - name: Detectar solución
        id: detecta
        shell: bash
        run: |
          sol=$(find . -path ./.git -prune -o \( -name '*.sln' -o -name '*.slnx' \) -print -quit)
          if [ -n "$sol" ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.detecta.outputs.existe == 'true'
        with: { global-json-file: global.json }
      # También hace falta Node aquí, no solo en el job `frontend`: el paso de empaquetado de más
      # abajo compila el frontend. Sin esto se usaría el Node que traiga el runner, que no es el
      # 24.15.0 de DOC_TECNICA §2.
      - uses: actions/setup-node@v4
        if: steps.detecta.outputs.existe == 'true'
        with: { node-version: '24.15.0', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: dotnet restore --locked-mode
        if: steps.detecta.outputs.existe == 'true'
      - run: dotnet build -c Release --warnaserror --no-restore
        if: steps.detecta.outputs.existe == 'true'
      # `dotnet test` NO sirve aquí: con xUnit v3 en proceso termina en verde sin ejecutar una sola
      # prueba (AGENTS §8, BUG-047). Se ejecuta el ejecutable de pruebas (Testcontainers con el Docker
      # del runner). El runner de xUnit v3 sale con 0 aunque haya 0 pruebas, así que el paso falla
      # además si el total ejecutado es 0, si hay fallos o si no aparece el resumen.
      - name: Pruebas del backend
        if: steps.detecta.outputs.existe == 'true'
        shell: bash
        run: |
          set -o pipefail
          dotnet backend/AtlasRent.Tests/bin/Release/net10.0/AtlasRent.Tests.dll -noColor | tee pruebas.txt
          total=$(grep -oE 'Total: [0-9]+' pruebas.txt | awk '{s+=$2} END {print s+0}')
          fallos=$(grep -oE 'Failed: [0-9]+' pruebas.txt | awk '{s+=$2} END {print s+0}')
          echo "Pruebas ejecutadas: $total; fallidas: $fallos"
          if [ "$total" -eq 0 ]; then echo "::error::0 pruebas ejecutadas"; exit 1; fi
          if [ "$fallos" -gt 0 ]; then echo "::error::hay pruebas fallidas"; exit 1; fi
      - name: Paquetes vulnerables
        if: steps.detecta.outputs.existe == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -E "High|Critical" vuln.txt
      # El paquete de despliegue tiene que llevar la interfaz (DOC_TECNICA §1 y §9.3). Sin esta
      # comprobación, el fallo que ya ocurrió —publicar sin frontend en wwwroot— volvería a
      # colarse sin que nadie se entere, y se instalaría un servicio sin interfaz.
      - name: El paquete incluye el frontend compilado
        if: steps.detecta.outputs.existe == 'true'
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          dotnet publish backend/AtlasRent.Api -c Release -o /tmp/paquete
          test -f /tmp/paquete/wwwroot/index.html
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # working-directory: . en el paso detector para que no herede el `frontend` del job.
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - name: Detectar frontend
        id: detecta
        shell: bash
        working-directory: .
        run: test -f frontend/package.json && echo "existe=true" >> "$GITHUB_OUTPUT" || echo "existe=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detecta.outputs.existe == 'true'
        with: { node-version: '24.15.0', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        if: steps.detecta.outputs.existe == 'true'
      - run: npm audit --audit-level=high
        if: steps.detecta.outputs.existe == 'true'
      - run: npm run lint
        if: steps.detecta.outputs.existe == 'true'
      - run: npm run typecheck
        if: steps.detecta.outputs.existe == 'true'
      - run: npm test
        if: steps.detecta.outputs.existe == 'true'
      - run: npm run build
        if: steps.detecta.outputs.existe == 'true'
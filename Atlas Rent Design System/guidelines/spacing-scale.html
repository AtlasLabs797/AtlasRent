<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div style="display:grid;gap:5px"><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-1</span><span style="height:8px;width:6px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">2px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-2</span><span style="height:8px;width:12px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">4px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-3</span><span style="height:8px;width:18px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">6px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-4</span><span style="height:8px;width:24px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">8px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-5</span><span style="height:8px;width:30px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">10px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-6</span><span style="height:8px;width:36px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">12px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-7</span><span style="height:8px;width:51px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">17px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-8</span><span style="height:8px;width:60px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">20px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-9</span><span style="height:8px;width:72px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">24px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-10</span><span style="height:8px;width:96px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">32px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-11</span><span style="height:8px;width:120px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">40px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-12</span><span style="height:8px;width:144px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">48px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-13</span><span style="height:8px;width:192px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">64px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:80px">--space-14</span><span style="height:8px;width:240px;background:var(--hibisco-300);border-radius:999px"></span><span class="v">80px</span></div></div></body></html>

<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces & text" subtitle="Parchment page, white cards, accent tint for selection" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="v" style="margin-top:6px">--surface-app</div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="v" style="margin-top:6px">--surface-card</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="v" style="margin-top:6px">--surface-sunken</div></div><div class="sw"><div class="chip" style="background:var(--surface-selected)"></div><div class="v" style="margin-top:6px">--surface-selected</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="v" style="margin-top:6px">--surface-inverse</div></div></div><div class="row" style="margin-top:20px;align-items:baseline;gap:24px"><div><div style="font:600 21px/1 var(--font-sans);letter-spacing:var(--tracking-heading);color:var(--text-strong)">Aa 1,250</div><div class="v" style="margin-top:4px">--text-strong</div></div><div><div style="font:600 21px/1 var(--font-sans);letter-spacing:var(--tracking-heading);color:var(--text-muted)">Aa 1,250</div><div class="v" style="margin-top:4px">--text-muted</div></div><div><div style="font:600 21px/1 var(--font-sans);letter-spacing:var(--tracking-heading);color:var(--text-subtle)">Aa 1,250</div><div class="v" style="margin-top:4px">--text-subtle</div></div><div><div style="font:600 21px/1 var(--font-sans);letter-spacing:var(--tracking-heading);color:var(--text-disabled)">Aa 1,250</div><div class="v" style="margin-top:4px">--text-disabled</div></div><div><div style="font:600 21px/1 var(--font-sans);letter-spacing:var(--tracking-heading);color:var(--text-link)">Aa 1,250</div><div class="v" style="margin-top:4px">--text-link</div></div></div></body></html>

<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="5 / 8 / 11 / 18 / pill — nothing in between" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row" style="gap:16px"><div class="sw"><div style="height:64px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div class="l">--radius-xs</div><div class="v">5px</div></div><div class="sw"><div style="height:64px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div class="l">--radius-sm</div><div class="v">8px</div></div><div class="sw"><div style="height:64px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div class="l">--radius-md</div><div class="v">11px</div></div><div class="sw"><div style="height:64px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div class="l">--radius-lg</div><div class="v">18px · cards</div></div><div class="sw"><div style="height:64px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><div class="l">--radius-pill</div><div class="v">999px · buttons</div></div></div></body></html>

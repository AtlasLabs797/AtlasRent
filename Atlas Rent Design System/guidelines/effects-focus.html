<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row" style="gap:20px;align-items:center"><div style="height:44px;width:170px;border:1px solid var(--border-focus);box-shadow:var(--ring-focus);border-radius:var(--radius-field)"></div><div style="height:44px;width:170px;border:1px solid var(--danger);box-shadow:var(--ring-danger);border-radius:var(--radius-field)"></div><div class="v">--ease-out cubic-bezier(.22,1,.36,1)<br>100 · 120 · 180 · 240 · 420ms<br>press scale(.95)</div></div></body></html>

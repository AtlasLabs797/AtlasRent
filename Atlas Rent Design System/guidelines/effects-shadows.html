<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row" style="gap:20px;padding:20px;background:var(--surface-app);border-radius:var(--radius-lg)"><div class="sw"><div style="height:80px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-card)"></div><div class="v" style="margin-top:8px">Card · hairline, none</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div class="v" style="margin-top:8px">--shadow-lg · menu, toast</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><div class="v" style="margin-top:8px">--shadow-xl · dialog</div></div></div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row" style="flex-wrap:wrap"><div class="sw" style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--radius-md)"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:var(--unit-disponible)"></span><span style="font:var(--type-label);color:var(--text-strong);white-space:nowrap">Disponible</span></div><div class="sw" style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--radius-md)"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:var(--unit-reservado)"></span><span style="font:var(--type-label);color:var(--text-strong);white-space:nowrap">Reservado</span></div><div class="sw" style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--radius-md)"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:var(--unit-ocupado)"></span><span style="font:var(--type-label);color:var(--text-strong);white-space:nowrap">Ocupado</span></div><div class="sw" style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--radius-md)"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:var(--unit-mantenimiento)"></span><span style="font:var(--type-label);color:var(--text-strong);white-space:nowrap">En mantenimiento</span></div><div class="sw" style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--radius-md)"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:var(--unit-fuera)"></span><span style="font:var(--type-label);color:var(--text-strong);white-space:nowrap">Fuera de servicio</span></div></div><div class="v" style="margin-top:12px">--unit-disponible · --unit-reservado · --unit-ocupado · --unit-mantenimiento · --unit-fuera</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1;height:128px;border-radius:var(--radius-card);border:1px solid var(--border-default);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><div style="display:flex;align-items:center;gap:10px"><span style="width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--font-sans)">AR</span><span style="font:600 28px/1 var(--font-display);letter-spacing:var(--tracking-heading);color:var(--text-strong)">Atlas <span style="color:var(--accent-text)">Rent</span></span></div><span style="font:var(--type-caption);color:var(--text-subtle)">by Atlas Labs</span></div><div style="flex:1;height:128px;border-radius:var(--radius-card);background:var(--tile-1);display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--font-sans)">AR</span><span style="font:600 28px/1 var(--font-display);letter-spacing:var(--tracking-heading);color:#F5F5F7">Atlas <span style="color:var(--accent-on-dark)">Rent</span></span></div></div></body></html>

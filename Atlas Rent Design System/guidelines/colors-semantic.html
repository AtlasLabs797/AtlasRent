<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font:var(--type-body)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.l{font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-strong);margin-top:8px}.v{font:400 12px/1.4 var(--font-mono);color:var(--text-muted)}.cap{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div style="margin-top:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--success-border);background:var(--success-soft);color:var(--success);font:var(--type-caption)"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Pagado</span></div><div class="v" style="margin-top:6px">--success</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div style="margin-top:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--warning-border);background:var(--warning-soft);color:var(--warning);font:var(--type-caption)"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Parcial</span></div><div class="v" style="margin-top:6px">--warning</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div style="margin-top:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--danger-border);background:var(--danger-soft);color:var(--danger);font:var(--type-caption)"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Vencida</span></div><div class="v" style="margin-top:6px">--danger</div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div style="margin-top:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--info-border);background:var(--info-soft);color:var(--info);font:var(--type-caption)"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Reservado</span></div><div class="v" style="margin-top:6px">--info</div></div><div class="sw"><div class="chip" style="background:var(--ai)"></div><div style="margin-top:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--ai-border);background:var(--ai-soft);color:var(--ai);font:var(--type-caption)"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Agente</span></div><div class="v" style="margin-top:6px">--ai</div></div></div></body></html>
